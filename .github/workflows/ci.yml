name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-runtime:
    name: ${{ matrix.platform }} runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify source and shared core
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal schemas capabilities)"
          test -z "$unformatted" || { echo "Go files require formatting:"; echo "$unformatted"; exit 1; }
          go mod verify
          go vet ./...
          go test -race ./...
          ./scripts/check_vulnerabilities.sh
          mkdir -p bin
          go build -trimpath -o bin/finspect ./cmd/finspect
          go build -trimpath -o bin/file-vitals-capability ./cmd/capability-adapter
          bin/finspect doctor
          git diff --check
      - name: Build and probe the native plugin bundle
        shell: bash
        run: |
          ./scripts/check_build_path_guard.sh
          ./scripts/check_app_build_path_guard.sh
          ./scripts/build_plugin.sh --replace
          bundle="$PWD/dist/plugin/file-vitals-0.1.0-$(go env GOOS)-$(go env GOARCH)"
          python3 scripts/check_release_legal.py "$bundle"
          python3 scripts/probe_plugin.py "$bundle"
          (cd dist/plugin && shasum -a 256 -c "$(basename "$bundle").tar.gz.sha256")
          tar -tzf "$bundle.tar.gz" >/dev/null
      - name: Build and test the macOS app
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          swift test --package-path app/FileVitals
          ./script/build_and_run.sh --build
